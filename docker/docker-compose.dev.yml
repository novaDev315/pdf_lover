version: "3.9"

services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3001
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && cd /app && pnpm install && pnpm dev"
    networks:
      - pdflover-network
    depends_on:
      - postgres
      - redis

  api:
    image: node:20-alpine
    working_dir: /app/apps/api
    volumes:
      - ../:/app
      - api_node_modules:/app/apps/api/node_modules
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://pdflover:pdflover_dev@postgres:5432/pdflover
      - REDIS_URL=redis://redis:6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production}
      - PORT=3001
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    networks:
      - pdflover-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=pdflover
      - POSTGRES_USER=pdflover
      - POSTGRES_PASSWORD=pdflover_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdflover -d pdflover"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pdflover-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pdflover-network

volumes:
  postgres_data:
    name: pdflover_postgres_data
  redis_data:
    name: pdflover_redis_data
  node_modules:
    name: pdflover_node_modules
  web_node_modules:
    name: pdflover_web_node_modules
  api_node_modules:
    name: pdflover_api_node_modules

networks:
  pdflover-network:
    name: pdflover-network
    driver: bridge
