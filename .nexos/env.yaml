project: pdflover

environments:
  local:
    non_secret:
      APP_ENV: development
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      CORS_ORIGINS: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:8000
      JOB_TEMP_ROOT: /tmp/pdflover-jobs
      MAX_UPLOAD_BYTES: "104857600"
      ARTIFACT_TTL_SECONDS: "1800"
      JOB_CLEANUP_INTERVAL_SECONDS: "60"
      GLOBAL_JOB_CONCURRENCY: "4"
      CLIENT_JOB_CONCURRENCY: "2"
      PROCESS_TIMEOUT_SECONDS: "300"
      OPENROUTER_TIMEOUT_SECONDS: "90"
    optional_secrets:
      - OPENROUTER_API_KEY

  production:
    non_secret:
      APP_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      CORS_ORIGINS: https://web.pdflover.lab.novadev.tech
      VITE_API_BASE_URL: https://api.pdflover.lab.novadev.tech
      JOB_TEMP_ROOT: /tmp/pdflover-jobs
      MAX_UPLOAD_BYTES: "104857600"
      ARTIFACT_TTL_SECONDS: "1800"
      JOB_CLEANUP_INTERVAL_SECONDS: "60"
      GLOBAL_JOB_CONCURRENCY: "4"
      CLIENT_JOB_CONCURRENCY: "2"
      PROCESS_TIMEOUT_SECONDS: "300"
      OPENROUTER_TIMEOUT_SECONDS: "90"
    optional_secrets:
      - OPENROUTER_API_KEY
