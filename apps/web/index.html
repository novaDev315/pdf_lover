<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PDFLover - Local-first PDF processing with explicit temporary server jobs for secure operations." />
    <meta name="keywords" content="PDF, merge, split, compress, convert, privacy, local, browser" />
    <meta name="author" content="PDFLover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#dc2626" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PDFLover" />
    <meta name="application-name" content="PDFLover" />
    <meta name="msapplication-TileColor" content="#dc2626" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png" />

    <!-- Favicon variants -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#dc2626" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PDFLover - Your Privacy-First PDF Tool" />
    <meta property="og:description" content="Local-first PDF tools with explicit temporary server jobs for secure operations." />
    <meta property="og:site_name" content="PDFLover" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PDFLover - Your Privacy-First PDF Tool" />
    <meta name="twitter:description" content="Local-first PDF tools with explicit temporary server jobs for secure operations." />
    <meta name="twitter:image" content="/og-image.png" />

    <title>PDFLover - Your Privacy-First PDF Tool</title>

    <script>
      (() => {
        const root = document.documentElement;
        const systemTheme = () =>
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

        try {
          const settings = JSON.parse(localStorage.getItem('pdflover-settings') || 'null')?.state;
          const theme = settings?.theme === 'light' || settings?.theme === 'dark'
            ? settings.theme
            : systemTheme();

          root.classList.add(theme);
          root.style.colorScheme = theme;

          if (settings?.appearance?.accentColor) {
            root.dataset.accent = settings.appearance.accentColor;
          }
          if (settings?.appearance?.fontSize) {
            root.dataset.fontSize = settings.appearance.fontSize;
          }
        } catch {
          const theme = systemTheme();
          root.classList.add(theme);
          root.style.colorScheme = theme;
        }
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
