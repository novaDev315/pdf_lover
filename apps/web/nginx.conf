worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/javascript application/json application/manifest+json
        application/wasm image/svg+xml text/css text/plain;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/pdflover-security-headers.conf;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /sw.js {
            include /etc/nginx/pdflover-security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        # The Alpine nginx MIME database does not consistently include .mjs.
        # PDF.js loads its worker as an ES module, so Chromium requires a
        # JavaScript Content-Type instead of the default octet-stream type.
        location ~* \.mjs$ {
            include /etc/nginx/pdflover-security-headers.conf;
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif|wasm)$ {
            include /etc/nginx/pdflover-security-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/pdflover-security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. {
            deny all;
        }
    }
}
